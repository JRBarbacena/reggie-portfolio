name: Lighthouse Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Performance and accessibility audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pin exact CLI version via npx so @lhci/cli (and its puppeteer tree)
      # never enter package-lock.json / npm audit.
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
