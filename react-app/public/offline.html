<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <title>Offline | Reggie</title>
    <style>
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100svh; margin: 0; place-items: center; padding: 1.25rem; background: #fff; color: #303540; font-family: Inter, system-ui, sans-serif; }
      main { width: min(100%, 38rem); padding: clamp(1.5rem, 6vw, 3rem); border: 1px solid #fff; border-radius: 1.5rem; background: rgb(255 255 255 / 78%); box-shadow: 14px 14px 34px rgb(88 99 116 / 15%), -10px -10px 28px #fff; }
      p:first-child { color: #d5001c; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      h1 { max-width: 13ch; margin: .75rem 0; color: #20252e; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1; letter-spacing: -.05em; }
      p { color: #626a76; line-height: 1.65; }
      a { display: inline-flex; margin-top: 1rem; padding: .75rem 1rem; border-radius: 999px; background: #d5001c; color: #fff; font-weight: 750; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>Offline mode</p>
      <h1>This page needs a connection.</h1>
      <p>Reconnect and try again. Portfolio pages you previously opened may remain available.</p>
      <a href="/">Return home</a>
    </main>
  </body>
</html>
