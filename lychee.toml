# Link checker config for the static portfolio (Vercel cleanUrls).
# root_dir is passed on the CLI so it can be an absolute workspace path.

verbose = "warning"
no_progress = true
max_retries = 3

# Match the workflow accept list (fonts / CDNs sometimes return 403/429).
accept = ["200", "204", "206", "301", "302", "403", "429"]

# /tech → tech.html, / → index.html (directory index)
fallback_extensions = ["html"]
index_files = ["index.html"]

# Strip cache-busting query strings before resolving local files.
remap = ["(.+)\\?v=.+ $1"]

exclude_path = [
  "(^|/)\\.cursor/",
  "(^|/)node_modules/",
  "(^|/)\\.git/",
]
